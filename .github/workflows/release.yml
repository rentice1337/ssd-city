name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure CMake
        run: cmake -B build -A x64

      - name: Build Release
        run: cmake --build build --config Release -- /m

      - name: Package zip
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item build/Release/ssd_city.exe dist/ssd_city.exe
          Copy-Item README.md dist/README.md
          Compress-Archive -Path dist/* -DestinationPath ssd-city-win64.zip -Force

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            build/Release/ssd_city.exe
            ssd-city-win64.zip
